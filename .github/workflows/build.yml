name: Build Universal macOS DMG
# on: push
on:
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  build:
    runs-on: macos-14 # Uses Apple Silicon M1 runner natively
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install DMG Builder Tool
        run: brew install create-dmg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Virtual Environment and Install Base Requirements
        env:
          ARCHFLAGS: "-arch arm64 -arch x86_64"
          _PYTHON_HOST_PLATFORM: "macosx-11.0-universal2"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pyinstaller
          # Let requirements.txt install normal packages first
          pip install -r requirements.txt

#      - name: Install Universal2 wxPython and Dependencies
#        env:
#          ARCHFLAGS: "-arch arm64 -arch x86_64"
#          _PYTHON_HOST_PLATFORM: "macosx-11.0-universal2"
#          MACOSX_DEPLOYMENT_TARGET: "11.0"
#        run: |
#          python3 -m venv venv
#          source venv/bin/activate
#
#          python3 -m pip install --upgrade pip setuptools wheel
#          
#          # Force pip to download/compile a universal2 wheel of wxpython
#          # Note: If PyPI doesn't have a matching pre-built universal2 wheel for your exact Python microversion,
#          # pip will automatically safely handle the dual-slice cross-compilation here.
#          pip install --no-binary wxPython wxPython

      - name: Fetch and Stitch Complete Universal wxPython Environment
        run: |
          # 1. Prepare global tooling framework tools
          sudo /Library/Frameworks/Python.framework/Versions/3.10/bin/python3 -m pip install --upgrade pip setuptools wheel py2app

          # Create workspace directories
          mkdir -p /tmp/wx_intel /tmp/wx_arm /tmp/wx_universal

          # 2. Extract specific version matching targeted dependencies
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3 -m pip download wxPython==4.2.4 --platform macosx_10_10_x86_64 --only-binary=:all: --dest /tmp/wx_intel
          unzip /tmp/wx_intel/[wW][xX]python*.whl -d /tmp/wx_intel/extracted

          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3 -m pip download wxPython==4.2.4 --platform macosx_11_0_arm64 --only-binary=:all: --dest /tmp/wx_arm
          unzip /tmp/wx_arm/[wW][xX]python*.whl -d /tmp/wx_arm/extracted

          # 3. Synchronize structural baseline mappings
          cp -R /tmp/wx_arm/extracted/* /tmp/wx_universal/

          # 4. Process deep recursive multi-architecture lipo bindings
          cd /tmp/wx_universal/wx
          find . -type f \( -name "*.so" -o -name "*.dylib" \) | while read -r file; do
            intel_bin="/tmp/wx_intel/extracted/wx/$file"
            arm_bin="/tmp/wx_arm/extracted/wx/$file"
            
            if [ -f "$intel_bin" ] && [ -f "$arm_bin" ]; then
              echo "Stitching binary asset: $file"
              lipo -create "$intel_bin" "$arm_bin" -output "$file"
            fi
          done

          # 5. Overwrite the system target array so py2app handles integration properly
          SYS_PACKAGES="/Library/Frameworks/Python.framework/Versions/3.10/lib/python3.10/site-packages"
          sudo rm -rf "$SYS_PACKAGES/wx" "$SYS_PACKAGES/[wW][xX][pP]ython"*
          sudo cp -R /tmp/wx_universal/wx "$SYS_PACKAGES/"
          sudo cp -R /tmp/wx_universal/[wW][xX][pP]ython*.dist-info "$SYS_PACKAGES/"

      - name: Fix Architecture Binaries & Execute Build
        env:
          ARCHFLAGS: "-arch arm64 -arch x86_64"
          _PYTHON_HOST_PLATFORM: "macosx-11.0-universal2"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

        run: |
          source venv/bin/activate
          chmod +x build.sh build__dmg.sh
          
          # 1. Dynamically stitch arm64 and x86_64 binaries into fat universal files
          echo "Fusing architecture-specific helper binaries into Universal Binaries..."
          for file in bin/mac_arm64/*; do
            filename=$(basename "$file")
            if [ -f "bin/mac_x86_64/$filename" ]; then
              lipo -create "bin/mac_arm64/$filename" "bin/mac_x86_64/$filename" -output "bin/$filename"
              echo "  Created universal binary for: $filename"
            fi
          done
          
          # 2. Run the original foundational build script 
          # Now `cp bin/* dist/EasyABC.app/Contents/Helpers` will grab the newly created universal files!
          ./build.sh

      - name: Code Sign Application Bundle
        run: |
          # Recursively deep-sign the bundle with an ad-hoc local identity (-)
          codesign --force --deep --sign - dist/EasyABC.app
          
          # 3. Generate the final DMG package
          # echo "Bypassing interactive DMG layout prompts..."
          # printf "\n\n" | ./build__dmg.sh

          # 3. Replicate build__dmg.sh file layout using a temporary Staging Directory
          echo "Setting up DMG staging directory..."
          mkdir -p dmg_staging
          
          # Copy extra contents from your source directory (mirroring cp -R "$SRC_DIR/" "$TEMP_VOL/")
          # Assuming extra assets are in a folder called 'Resources' or similar—adjust path if needed:
          if [ -d "dmg" ]; then
            cp -R dmg/* dmg_staging/
          fi

          if [ ! -f "dmg_staging/Ghostscript.pkg" ]; then
              echo "  Warning: Ghostscript.pkg not present, downloading it from https://pages.uoregon.edu/koch/"
              curl https://pages.uoregon.edu/koch/Ghostscript-10.07.1.pkg -o "dmg_staging/Ghostscript.pkg"
          fi

          # Move your freshly built application into the staging folder
          cp -R dist/EasyABC.app dmg_staging/

          # 4. Use create-dmg targeting the folder instead of a single file
          # (create-dmg automatically generates the Applications symlink via --app-drop-link)
          create-dmg \
            --volname "EasyABC Installer" \
            --background "img/abclogo.png" \
            --window-pos 200 120 \
            --window-size 600 420 \
            --icon-size 60 \
            --icon "EasyABC.app" 110 120 \
            --app-drop-link 370 120 \
            --icon "README" 100 250 \
            --icon "Ghostscript.pkg" 270 250 \
            --icon "Install_Ghostscript.webloc" 440 250 \
            "EasyABC-Universal.dmg" \
            "dmg_staging/"

      - name: Upload Finished DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyABC-Universal-DMG
          path: EasyABC-Universal.dmg
